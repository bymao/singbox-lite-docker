# 启动：docker compose up -d --build
# 配置：docker compose exec singbox sb
# 首次使用在 sb 菜单中选择 [15] 安装 sing-box，或 [16] 安装 Xray。
# 更新上游脚本：docker compose restart singbox（每次启动都会重新下载）。
# 配置沿用 ./config/sing-box；核心和工具保存在 binaries 卷中，重建容器不会丢失。
# 旧容器的核心未保存在卷中，迁移后需在菜单中重新安装一次。
services:
  singbox:
    build: .
    container_name: singbox-lite
    restart: unless-stopped
    init: true
    network_mode: bridge

    # bridge 模式下请根据节点实际监听端口添加映射，然后重建容器。
    # ports:
    #   - "443:443/tcp"
    #   - "443:443/udp"
    #   - "8443:8443/tcp"
    #   - "8443:8443/udp"

    # nftables / TUN 功能按需开启；普通用户态转发无需此权限。
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun:/dev/net/tun

    volumes:
      - ./config/sing-box:/usr/local/etc/sing-box
      - ./config/xray:/usr/local/etc/xray
      - binaries:/usr/local/bin

    environment:
      TZ: Asia/Shanghai

    # mem_limit: 256m

# docker compose down 默认保留此卷；加 -v 会删除已安装的核心和工具。
volumes:
  binaries:
